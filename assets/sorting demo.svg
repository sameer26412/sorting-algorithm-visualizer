<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="100%" height="100%">
    <defs>
        <linearGradient id="barOffWhite" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F5F5F0"/>
            <stop offset="100%" stop-color="#BDBDB6"/>
        </linearGradient>
        <linearGradient id="barAmber" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FBBF24"/>
            <stop offset="100%" stop-color="#D97706"/>
        </linearGradient>
        <linearGradient id="barCoral" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#F87171"/>
            <stop offset="100%" stop-color="#DC2626"/>
        </linearGradient>
        <linearGradient id="barSage" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34D399"/>
            <stop offset="100%" stop-color="#059669"/>
        </linearGradient>
        <style>
            .font-ui { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
            .font-mono { font-family: 'JetBrains Mono', monospace; }
            @keyframes pulseAmber {
                0%, 100% { fill: url(#barOffWhite); }
                30%, 60% { fill: url(#barAmber); }
            }
            @keyframes swapCoral {
                0%, 25% { height: 220px; y: 160px; fill: url(#barOffWhite); }
                40%, 65% { height: 95px; y: 285px; fill: url(#barCoral); }
                80%, 100% { height: 95px; y: 285px; fill: url(#barSage); }
            }
            @keyframes swapCoralPartner {
                0%, 25% { height: 95px; y: 285px; fill: url(#barOffWhite); }
                40%, 65% { height: 220px; y: 160px; fill: url(#barCoral); }
                80%, 100% { height: 220px; y: 160px; fill: url(#barSage); }
            }
            @keyframes sweepSorted {
                0%, 70% { fill: url(#barOffWhite); }
                85%, 100% { fill: url(#barSage); }
            }
            .anim-bar-1 { animation: sweepSorted 4s infinite ease-in-out; }
            .anim-bar-2 { animation: pulseAmber 4s infinite ease-in-out; }
            .anim-bar-swap-a { animation: swapCoral 4s infinite ease-in-out; }
            .anim-bar-swap-b { animation: swapCoralPartner 4s infinite ease-in-out; }
        </style>
    </defs>

    <!-- Background Window -->
    <rect width="900" height="460" rx="14" fill="#121212" stroke="#2A2A2A" stroke-width="2"/>

    <!-- Top Header Bar -->
    <rect x="0" y="0" width="900" height="52" rx="14" fill="#1A1A1A"/>
    <line x1="0" y1="52" x2="900" y2="52" stroke="#2A2A2A" stroke-width="1"/>
    <rect x="20" y="14" width="24" height="24" rx="6" fill="#F5F5F0"/>
    <text x="54" y="31" fill="#F5F5F0" font-size="14" font-weight="600" class="font-ui">Sorting Algorithm Visualizer</text>
    <rect x="260" y="17" width="64" height="19" rx="4" fill="#242424" stroke="#363636"/>
    <text x="272" y="30" fill="#FBBF24" font-size="10" class="font-mono">RUNNING</text>

    <!-- Algorithm Pill Bar -->
    <rect x="370" y="11" width="290" height="30" rx="8" fill="#121212" stroke="#2A2A2A"/>
    <rect x="375" y="15" width="56" height="22" rx="6" fill="#F5F5F0"/>
    <text x="386" y="29" fill="#121212" font-size="10" font-weight="700" class="font-ui">Quick</text>
    <text x="445" y="29" fill="#A0A09C" font-size="10" class="font-ui">Merge</text>
    <text x="495" y="29" fill="#A0A09C" font-size="10" class="font-ui">Heap</text>
    <text x="540" y="29" fill="#A0A09C" font-size="10" class="font-ui">Bubble</text>
    <text x="595" y="29" fill="#A0A09C" font-size="10" class="font-ui">Insertion</text>

    <!-- Live Metrics -->
    <text x="690" y="30" fill="#FBBF24" font-size="11" class="font-mono">CMP: 42</text>
    <text x="760" y="30" fill="#EF4444" font-size="11" class="font-mono">SWP: 19</text>
    <text x="830" y="30" fill="#F5F5F0" font-size="11" class="font-mono">1.4s</text>

    <!-- Left Sidebar Mockup -->
    <rect x="20" y="70" width="250" height="368" rx="10" fill="#1A1A1A" stroke="#2A2A2A"/>
    <text x="36" y="96" fill="#A0A09C" font-size="10" class="font-mono">PLAYBACK CONTROLS</text>
    <rect x="36" y="110" width="104" height="32" rx="6" fill="#F5F5F0"/>
    <text x="62" y="130" fill="#121212" font-size="11" font-weight="600" class="font-ui">Start Sort</text>
    <rect x="150" y="110" width="104" height="32" rx="6" fill="#242424" stroke="#363636"/>
    <text x="186" y="130" fill="#FBBF24" font-size="11" class="font-ui">Pause</text>

    <text x="36" y="175" fill="#A0A09C" font-size="10" class="font-mono">CUSTOM DATASET INPUT</text>
    <rect x="36" y="186" width="160" height="28" rx="6" fill="#121212" stroke="#363636"/>
    <text x="44" y="204" fill="#F5F5F0" font-size="10" class="font-mono">45, 12, 89, 33, 7, 64</text>
    <rect x="202" y="186" width="52" height="28" rx="6" fill="#E6E6E1"/>
    <text x="213" y="204" fill="#121212" font-size="10" font-weight="600" class="font-ui">Apply</text>

    <!-- Sliders -->
    <text x="36" y="246" fill="#D0D0CA" font-size="10" class="font-ui">Array Size: 14 bars</text>
    <rect x="36" y="256" width="218" height="5" rx="2.5" fill="#2A2A2A"/>
    <circle cx="120" cy="258.5" r="7" fill="#F5F5F0"/>

    <text x="36" y="292" fill="#D0D0CA" font-size="10" class="font-ui">Sorting Speed: 25 ms / step</text>
    <rect x="36" y="302" width="218" height="5" rx="2.5" fill="#2A2A2A"/>
    <circle cx="195" cy="304.5" r="7" fill="#F5F5F0"/>

    <!-- Complexity Box -->
    <rect x="36" y="334" width="218" height="86" rx="8" fill="#121212" stroke="#2A2A2A"/>
    <text x="48" y="354" fill="#F5F5F0" font-size="11" font-weight="700" class="font-ui">QUICK SORT</text>
    <text x="48" y="374" fill="#34D399" font-size="10" class="font-mono">Best: O(n log n)</text>
    <text x="48" y="392" fill="#FBBF24" font-size="10" class="font-mono">Avg:  O(n log n)</text>
    <text x="48" y="410" fill="#A0A09C" font-size="10" class="font-mono">Space: O(log n)</text>

    <!-- Right Visualizer Stage -->
    <rect x="288" y="70" width="592" height="368" rx="10" fill="#1A1A1A" stroke="#2A2A2A"/>
    <text x="310" y="96" fill="#E6E6E1" font-size="11" class="font-mono">Partitioning subarray around pivot · Active Swap</text>

    <!-- Animated Bars -->
    <g>
        <rect x="315" y="330" width="28" height="50" rx="3" class="anim-bar-1" fill="url(#barSage)"/>
        <rect x="353" y="305" width="28" height="75" rx="3" class="anim-bar-1" fill="url(#barSage)"/>
        <rect x="391" y="160" width="28" height="220" rx="3" class="anim-bar-swap-a"/>
        <rect x="429" y="285" width="28" height="95" rx="3" class="anim-bar-swap-b"/>
        <rect x="467" y="245" width="28" height="135" rx="3" class="anim-bar-2"/>
        <rect x="505" y="215" width="28" height="165" rx="3" class="anim-bar-2"/>
        <rect x="543" y="190" width="28" height="190" rx="3" class="anim-bar-1"/>
        <rect x="581" y="170" width="28" height="210" rx="3" class="anim-bar-1"/>
        <rect x="619" y="145" width="28" height="235" rx="3" class="anim-bar-1"/>
        <rect x="657" y="125" width="28" height="255" rx="3" fill="url(#barSage)"/>
        <rect x="695" y="110" width="28" height="270" rx="3" fill="url(#barSage)"/>
        <rect x="733" y="95" width="28" height="285" rx="3" fill="url(#barSage)"/>
        <rect x="771" y="80" width="28" height="300" rx="3" fill="url(#barSage)"/>
        <rect x="809" y="65" width="28" height="315" rx="3" fill="url(#barSage)"/>
    </g>

    <!-- Baseline -->
    <line x1="305" y1="380" x2="860" y2="380" stroke="#2E2E2E" stroke-width="2"/>
    <text x="310" y="415" fill="#A0A09C" font-size="11" class="font-mono">ARRAY: [ 12, 19, 28, 34, 45, 52, 61, 68, 74, 81, 86, 91, 95, 99 ]</text>
</svg>
